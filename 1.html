<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Metal Slug Prototype</title>
    <style>
        body { margin: 0; background: #222; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; }
        canvas { background: #5c94fc; border: 2px solid #fff; }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

canvas.width = 800;
canvas.height = 400;

// Game Constants
const GRAVITY = 0.8;
const GROUND_Y = 350;

// Game State
let player = {
    x: 50, y: 300, width: 40, height: 60,
    dx: 0, dy: 0, speed: 5, jumpPower: -15,
    grounded: false, bullets: []
};

let enemies = [];
let keys = {};

// Event Listeners
window.addEventListener('keydown', e => keys[e.code] = true);
window.addEventListener('keyup', e => keys[e.code] = false);

function spawnEnemy() {
    if (Math.random() < 0.02) {
        enemies.push({ x: canvas.width, y: GROUND_Y - 50, width: 40, height: 50, speed: 2 });
    }
}

function update() {
    // Player Move
    if (keys['ArrowLeft']) player.dx = -player.speed;
    else if (keys['ArrowRight']) player.dx = player.speed;
    else player.dx = 0;

    if (keys['Space'] && player.grounded) {
        player.dy = player.jumpPower;
        player.grounded = false;
    }

    // Shoot (Z key)
    if (keys['KeyZ']) {
        if (player.bullets.length < 5) { // Limit fire rate
            player.bullets.push({ x: player.x + player.width, y: player.y + 20, speed: 10 });
            keys['KeyZ'] = false; // Semi-auto logic
        }
    }

    // Physics
    player.dy += GRAVITY;
    player.x += player.dx;
    player.y += player.dy;

    if (player.y + player.height > GROUND_Y) {
        player.y = GROUND_Y - player.height;
        player.dy = 0;
        player.grounded = true;
    }

    // Bullets logic
    player.bullets.forEach((b, i) => {
        b.x += b.speed;
        if (b.x > canvas.width) player.bullets.splice(i, 1);
    });

    // Enemies logic
    enemies.forEach((en, i) => {
        en.x -= en.speed;
        // Collision detection (Bullet vs Enemy)
        player.bullets.forEach((b, bi) => {
            if (b.x > en.x && b.x < en.x + en.width && b.y > en.y && b.y < en.y + en.height) {
                enemies.splice(i, 1);
                player.bullets.splice(bi, 1);
            }
        });
        if (en.x + en.width < 0) enemies.splice(i, 1);
    });

    spawnEnemy();
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Ground
    ctx.fillStyle = '#654321';
    ctx.fillRect(0, GROUND_Y, canvas.width, canvas.height - GROUND_Y);

    // Player (Placeholder)
    ctx.fillStyle = '#ffff00';
    ctx.fillRect(player.x, player.y, player.width, player.height);

    // Bullets
    ctx.fillStyle = '#fff';
    player.bullets.forEach(b => ctx.fillRect(b.x, b.y, 10, 5));

    // Enemies (Placeholder)
    ctx.fillStyle = '#ff0000';
    enemies.forEach(en => ctx.fillRect(en.x, en.y, en.width, en.height));

    requestAnimationFrame(() => {
        update();
        draw();
    });
}

draw();
</script>
</body>
</html>
